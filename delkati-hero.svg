<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" width="1200" height="1500" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#EFE6EC"/><stop offset=".55" stop-color="#D9CDD6"/><stop offset="1" stop-color="#B9A9B5"/></linearGradient>
  <radialGradient id="glow" cx=".72" cy=".25" r=".6"><stop offset="0" stop-color="#fff" stop-opacity=".75"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
  <linearGradient id="marble" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FBF9FA"/><stop offset="1" stop-color="#DCD5DA"/></linearGradient>
  <linearGradient id="vase" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3A0B1B"/><stop offset=".35" stop-color="#8A1D3B"/><stop offset=".6" stop-color="#6A1329"/><stop offset="1" stop-color="#2E0815"/></linearGradient>
  <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7A3A10"/><stop offset=".4" stop-color="#C98A2B"/><stop offset=".7" stop-color="#A5611A"/><stop offset="1" stop-color="#6A3109"/></linearGradient>
  <linearGradient id="oil" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#B57A22"/><stop offset=".45" stop-color="#EDBE5F"/><stop offset="1" stop-color="#B27419"/></linearGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8A5A12"/><stop offset=".5" stop-color="#F0CB7A"/><stop offset="1" stop-color="#8A5A12"/></linearGradient>
  <linearGradient id="label" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF4F8"/><stop offset="1" stop-color="#F3C9DB"/></linearGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="14"/></filter>
  <filter id="soft"><feGaussianBlur stdDeviation="3"/></filter>
</defs>

<rect width="1200" height="1500" fill="url(#bg)"/>
<rect width="1200" height="1500" fill="url(#glow)"/>
<!-- soft sofa shapes -->
<ellipse cx="980" cy="520" rx="420" ry="360" fill="#fff" opacity=".18" filter="url(#blur)"/>
<ellipse cx="200" cy="640" rx="320" ry="260" fill="#8F7C8B" opacity=".25" filter="url(#blur)"/>

<!-- table -->
<ellipse cx="600" cy="1290" rx="760" ry="120" fill="#5B3A4E" opacity=".35" filter="url(#blur)"/>
<path d="M-60 1150 Q600 1050 1260 1150 L1260 1500 L-60 1500 Z" fill="url(#marble)"/>
<path d="M-60 1150 Q600 1050 1260 1150" fill="none" stroke="#fff" stroke-width="5" opacity=".9"/>
<g stroke="#B9AEB6" stroke-width="2" fill="none" opacity=".55">
  <path d="M120 1260 C300 1220 380 1330 560 1290 S900 1230 1100 1320"/>
  <path d="M-20 1380 C200 1340 400 1430 640 1380 S980 1340 1240 1420"/>
  <path d="M700 1190 C760 1230 820 1210 880 1250"/>
</g>

<!-- vase -->
<ellipse cx="330" cy="1175" rx="150" ry="26" fill="#2B0A14" opacity=".45" filter="url(#soft)"/>
<g>
  <!-- dried stems -->
  <g stroke="#CBB7A0" stroke-width="5" stroke-linecap="round" fill="none">
    <path d="M300 760 C250 600 170 470 120 300"/>
    <path d="M320 760 C320 600 330 450 300 250"/>
    <path d="M340 760 C380 600 470 500 520 330"/>
    <path d="M310 760 C230 650 150 600 70 520"/>
    <path d="M350 760 C430 680 500 640 580 600"/>
  </g>
  <g stroke="#B9A6C9" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M290 760 C200 640 190 520 210 380"/>
    <path d="M360 760 C400 620 420 480 470 400"/>
  </g>
  <!-- lavender buds -->
  <g fill="#C9B5D6">
    <ellipse cx="210" cy="400" rx="9" ry="26"/><ellipse cx="205" cy="450" rx="9" ry="24"/><ellipse cx="212" cy="500" rx="8" ry="22"/>
    <ellipse cx="470" cy="420" rx="9" ry="26"/><ellipse cx="455" cy="470" rx="9" ry="24"/><ellipse cx="440" cy="520" rx="8" ry="22"/>
  </g>
