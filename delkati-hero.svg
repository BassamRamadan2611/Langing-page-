  <g fill="#7E1630">
    <ellipse cx="120" cy="300" rx="42" ry="62" transform="rotate(-25 120 300)"/>
    <ellipse cx="300" cy="260" rx="40" ry="66"/>
    <ellipse cx="520" cy="335" rx="40" ry="62" transform="rotate(30 520 335)"/>
    <ellipse cx="70" cy="525" rx="36" ry="52" transform="rotate(-60 70 525)"/>
    <ellipse cx="585" cy="605" rx="36" ry="52" transform="rotate(70 585 605)"/>
  </g>
  <g fill="#A8284A" opacity=".8">
    <ellipse cx="108" cy="285" rx="16" ry="26" transform="rotate(-25 108 285)"/>
    <ellipse cx="292" cy="242" rx="15" ry="26"/>
    <ellipse cx="510" cy="318" rx="15" ry="26" transform="rotate(30 510 318)"/>
  </g>
  <g fill="#F2B7CB">
    <ellipse cx="160" cy="650" rx="14" ry="30" transform="rotate(25 160 650)"/>
    <ellipse cx="470" cy="660" rx="14" ry="30" transform="rotate(-25 470 660)"/>
  </g>
  <!-- vase body -->
  <path d="M255 770 L405 770 C400 820 380 850 395 900 C470 960 500 1040 470 1110 C450 1160 210 1160 190 1110 C160 1040 190 960 265 900 C280 850 260 820 255 770 Z" fill="url(#vase)"/>
  <ellipse cx="330" cy="770" rx="75" ry="14" fill="#2B0A14"/>
  <path d="M240 960 C225 1010 225 1060 245 1110" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="10" stroke-linecap="round"/>
</g>

<!-- serum bottle -->
<ellipse cx="700" cy="1205" rx="105" ry="20" fill="#3A1E2C" opacity=".4" filter="url(#soft)"/>
<g>
  <rect x="654" y="665" width="92" height="120" rx="40" fill="#14090D"/>
  <rect x="646" y="770" width="108" height="46" rx="6" fill="url(#gold)"/>
  <rect x="660" y="800" width="80" height="26" fill="url(#gold)"/>
  <path d="M640 826 H760 C790 850 800 880 800 920 V1180 C800 1198 786 1210 768 1210 H632 C614 1210 600 1198 600 1180 V920 C600 880 610 850 640 826 Z" fill="url(#amber)"/>
  <path d="M628 900 C620 960 620 1100 628 1190" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="9" stroke-linecap="round"/>
  <rect x="604" y="950" width="192" height="200" rx="8" fill="url(#label)"/>
  <path d="M604 1060 Q700 1010 796 1070 V1150 H604 Z" fill="#E7A3C0" opacity=".55"/>
  <text x="700" y="1005" text-anchor="middle" font-family="Georgia,'DejaVu Serif',serif" font-size="30" fill="#B93A6F" letter-spacing="4">DELKATI</text>
  <rect x="650" y="1022" width="100" height="3" fill="#B93A6F" opacity=".6"/>
  <rect x="640" y="1042" width="120" height="6" rx="3" fill="#7A3B52" opacity=".5"/>
  <rect x="660" y="1058" width="80" height="6" rx="3" fill="#7A3B52" opacity=".35"/>
  <text x="700" y="1132" text-anchor="middle" font-family="Georgia,serif" font-size="18" fill="#7A3B52">50 ml</text>
</g>

<!-- oil pump bottle -->
<ellipse cx="925" cy="1225" rx="120" ry="22" fill="#3A1E2C" opacity=".4" filter="url(#soft)"/>
<g>
  <rect x="898" y="520" width="26" height="60" rx="8" fill="#F8F5F6"/>
  <path d="M780 520 H922 V560 H830 Z" fill="#F8F5F6" opacity="0"/>
  <path d="M780 540 C780 520 800 508 830 508 H930 C940 508 946 516 946 526 V548 H900 V570 H940 V600 H900 V620 H870 V600 H840 V570 H870 V548 H795 Z" fill="#fff" opacity="0"/>
  <rect x="830" y="498" width="116" height="46" rx="18" fill="#FBF9FA"/>
  <rect x="780" y="508" width="70" height="22" rx="10" fill="#FBF9FA"/>
  <rect x="872" y="544" width="30" height="86" fill="#F4F0F2"/>
  <rect x="842" y="628" width="90" height="70" rx="10" fill="#FBF9FA"/>
  <path d="M842 698 H932 C970 730 990 760 990 800 V1195 C990 1215 975 1228 955 1228 H830 C810 1228 795 1215 795 1195 V800 C795 760 805 730 842 698 Z" fill="url(#oil)"/>
  <path d="M822 790 C815 900 815 1100 822 1200" fill="none" stroke="#fff" stroke-opacity=".4" stroke-width="10" stroke-linecap="round"/>
  <rect x="798" y="860" width="189" height="270" rx="8" fill="url(#label)"/>
  <path d="M798 1020 Q890 960 987 1030 V1122 H798 Z" fill="#E7A3C0" opacity=".55"/>
  <text x="892" y="925" text-anchor="middle" font-family="Georgia,'DejaVu Serif',serif" font-size="32" fill="#B93A6F" letter-spacing="4">DELKATI</text>
  <rect x="842" y="944" width="100" height="3" fill="#B93A6F" opacity=".6"/>
  <rect x="830" y="966" width="124" height="7" rx="3" fill="#7A3B52" opacity=".5"/>
  <rect x="852" y="984" width="80" height="6" rx="3" fill="#7A3B52" opacity=".35"/>
  <text x="892" y="1100" text-anchor="middle" font-family="Georgia,serif" font-size="18" fill="#7A3B52">100 ml</text>
</g>

<!-- petals on table -->
<g fill="#F2B7CB" opacity=".9">
  <ellipse cx="520" cy="1230" rx="16" ry="8" transform="rotate(-20 520 1230)"/>
  <ellipse cx="1060" cy="1270" rx="14" ry="7" transform="rotate(25 1060 1270)"/>
  <ellipse cx="470" cy="1300" rx="12" ry="6" transform="rotate(10 470 1300)"/>
</g>
</svg>
